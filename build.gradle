plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.rafaga'
version = '0.0.1-SNAPSHOT'

ext {
	set('springModulithVersion', '2.1.1')
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
	}
}

dependencies {
	implementation project(':modules:common')
	implementation project(':modules:identity')
	implementation project(':modules:tenant')
	implementation project(':modules:catalog')
	implementation project(':modules:inventory')
	implementation project(':modules:orders')
	implementation project(':modules:cart')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.2.0'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
	testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'io.spring.dependency-management'
	if (path != ':modules') {
		apply plugin: 'jacoco'
	}

	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs += '-parameters'
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.2'
			mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		}
	}

	dependencies {
		implementation 'org.springframework.modulith:spring-modulith-starter-core'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'
	}

	tasks.named('test') {
		useJUnitPlatform()
		systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'test')
		systemProperty 'spring.config.additional-location', rootProject.file('src/test/resources/').toURI().toString()
	}

	pluginManager.withPlugin('jacoco') {
		tasks.named('jacocoTestReport', JacocoReport) {
			dependsOn tasks.named('test')
			reports {
				html.required = true
				xml.required = true
				csv.required = false
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'test')
}

tasks.named('jacocoTestReport', JacocoReport) {
	def coverageProjects = [project] + subprojects.findAll { it.path != ':modules' }
	dependsOn coverageProjects.collect { it.tasks.named('test') }

	executionData.from(files(coverageProjects.collect { it.file('build/jacoco/test.exec') }))
	sourceDirectories.from(files(coverageProjects.collect { it.file('src/main/java') }))
	classDirectories.from(files(coverageProjects.collect { it.file('build/classes/java/main') }))

	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}
