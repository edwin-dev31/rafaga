version: "3.9"

services:
  backend:
    image: ${RAFAGA_BACKEND_IMAGE:?Set RAFAGA_BACKEND_IMAGE to an immutable image tag}
    environment:
      SPRING_PROFILES_ACTIVE: production
      RAFAGA_SERVER_PORT: "3117"
      DB_SHARED_URL: ${DB_SHARED_URL:?Set DB_SHARED_URL}
      DB_SHARED_USER: ${DB_SHARED_USER:?Set DB_SHARED_USER}
      DB_SHARED_PASSWORD: ${DB_SHARED_PASSWORD:?Set DB_SHARED_PASSWORD}
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:?Set REDIS_CLUSTER_NODES}
      REDIS_CLUSTER_MAX_REDIRECTS: ${REDIS_CLUSTER_MAX_REDIRECTS:-3}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-true}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:?Set KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?Set KEYCLOAK_ISSUER_URI}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?Set KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?Set KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_CONNECT_TIMEOUT: ${KEYCLOAK_CONNECT_TIMEOUT:-2s}
      KEYCLOAK_READ_TIMEOUT: ${KEYCLOAK_READ_TIMEOUT:-5s}
      RAFAGA_IDENTITY_REGISTRATION_TOKEN: ${RAFAGA_IDENTITY_REGISTRATION_TOKEN:?Set RAFAGA_IDENTITY_REGISTRATION_TOKEN}
      RAFAGA_ALLOWED_ORIGINS: ${RAFAGA_ALLOWED_ORIGINS:?Set RAFAGA_ALLOWED_ORIGINS}
      RAFAGA_TRUSTED_PROXY_CIDRS: ${RAFAGA_TRUSTED_PROXY_CIDRS:?Set RAFAGA_TRUSTED_PROXY_CIDRS}
      RAFAGA_MAX_REQUEST_CONTENT_LENGTH: ${RAFAGA_MAX_REQUEST_CONTENT_LENGTH:-1MB}
      RAFAGA_MAX_HTTP_REQUEST_HEADER_SIZE: ${RAFAGA_MAX_HTTP_REQUEST_HEADER_SIZE:-16KB}
      RAFAGA_MAX_HTTP_FORM_POST_SIZE: ${RAFAGA_MAX_HTTP_FORM_POST_SIZE:-1MB}
      RAFAGA_MAX_HTTP_SWALLOW_SIZE: ${RAFAGA_MAX_HTTP_SWALLOW_SIZE:-1MB}
      RAFAGA_SHUTDOWN_TIMEOUT: ${RAFAGA_SHUTDOWN_TIMEOUT:-30s}
      RAFAGA_RATE_LIMIT_ENABLED: ${RAFAGA_RATE_LIMIT_ENABLED:-true}
      RAFAGA_RATE_LIMIT_WINDOW: ${RAFAGA_RATE_LIMIT_WINDOW:-1m}
      RAFAGA_RATE_LIMIT_LOGIN_PER_WINDOW: ${RAFAGA_RATE_LIMIT_LOGIN_PER_WINDOW:-10}
      RAFAGA_RATE_LIMIT_REGISTRATION_PER_WINDOW: ${RAFAGA_RATE_LIMIT_REGISTRATION_PER_WINDOW:-3}
      RAFAGA_RATE_LIMIT_MEDIA_UPLOAD_PER_WINDOW: ${RAFAGA_RATE_LIMIT_MEDIA_UPLOAD_PER_WINDOW:-12}
      RAFAGA_RATE_LIMIT_MEDIA_CONFIRMATION_PER_WINDOW: ${RAFAGA_RATE_LIMIT_MEDIA_CONFIRMATION_PER_WINDOW:-24}
      RAFAGA_RATE_LIMIT_GUEST_CART_MUTATION_PER_WINDOW: ${RAFAGA_RATE_LIMIT_GUEST_CART_MUTATION_PER_WINDOW:-30}
      RAFAGA_RATE_LIMIT_CHECKOUT_PER_WINDOW: ${RAFAGA_RATE_LIMIT_CHECKOUT_PER_WINDOW:-8}
      RAFAGA_RATE_LIMIT_ORDER_CREATION_PER_WINDOW: ${RAFAGA_RATE_LIMIT_ORDER_CREATION_PER_WINDOW:-12}
      RAFAGA_RATE_LIMIT_MAX_FALLBACK_ENTRIES: ${RAFAGA_RATE_LIMIT_MAX_FALLBACK_ENTRIES:-10000}
      MEDIA_R2_ACCOUNT_ID: ${MEDIA_R2_ACCOUNT_ID:?Set MEDIA_R2_ACCOUNT_ID}
      MEDIA_R2_ACCESS_KEY_ID: ${MEDIA_R2_ACCESS_KEY_ID:?Set MEDIA_R2_ACCESS_KEY_ID}
      MEDIA_R2_SECRET_ACCESS_KEY: ${MEDIA_R2_SECRET_ACCESS_KEY:?Set MEDIA_R2_SECRET_ACCESS_KEY}
      MEDIA_R2_BUCKET: ${MEDIA_R2_BUCKET:-rafaga-media}
      MEDIA_R2_PUBLIC_BASE_URL: ${MEDIA_R2_PUBLIC_BASE_URL:?Set MEDIA_R2_PUBLIC_BASE_URL}
      MEDIA_R2_CONNECT_TIMEOUT: ${MEDIA_R2_CONNECT_TIMEOUT:-2s}
      MEDIA_R2_READ_TIMEOUT: ${MEDIA_R2_READ_TIMEOUT:-10s}
    networks:
      - edge
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 2m
      update_config:
        parallelism: 1
        delay: 20s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      resources:
        reservations:
          cpus: "0.50"
          memory: 512M
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3117/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  edge:
    external: true
    name: rafaga_edge
  data:
    external: true
    name: rafaga_data
