name: rafaga

services:
  postgres:
    image: postgres:16-alpine
    container_name: rafaga-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rafaga_shared}
      POSTGRES_USER: ${POSTGRES_USER:-rafaga_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rafaga_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rafaga_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: rafaga-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rafaga_postgres_data:
