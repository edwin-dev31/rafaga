name: rafaga

services:
  postgres:
    image: postgres:16-alpine
    container_name: rafaga-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rafaga_shared}
      POSTGRES_USER: ${POSTGRES_USER:-rafaga_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rafaga_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rafaga_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: rafaga-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: rafaga-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rafaga-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-rafaga_dev_client_secret}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-rafaga-backend-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-rafaga_dev_admin_client_secret}
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import:ro
      - ./scripts/keycloak/initialize-realm.sh:/opt/keycloak/bin/initialize-realm.sh:ro
    entrypoint: ["/bin/sh", "/opt/keycloak/bin/initialize-realm.sh"]

volumes:
  rafaga_postgres_data:
