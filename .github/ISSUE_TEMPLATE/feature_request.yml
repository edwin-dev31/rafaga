name: Feature Request
description: Propose a new feature or enhancement for Rafaga Backend
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve or what use case does it enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected endpoints, module changes, or behavior.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Multi-Tenant & Security Considerations
      description: Any tenant isolation, role (`STORE_MANAGER` / `SUPER_ADMIN`), or rate-limit implications.
    validations:
      required: false
