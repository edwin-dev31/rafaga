name: Tenant isolation

on:
  push:
  pull_request:

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Start test infrastructure
        run: docker compose -f compose.test.yaml up -d --wait
      - name: Configure the restricted database role
        run: docker compose -f compose.test.yaml run --rm postgres-role-setup-test
      - name: Run mandatory tenant-isolation suites
        run: >-
          ./gradlew --no-daemon --console=plain :test
          --tests com.rafaga.backend.CatalogApiIntegrationTest
          --tests com.rafaga.backend.InventoryApiIntegrationTest
          --tests com.rafaga.backend.OrderApiIntegrationTest
      - name: Stop test infrastructure
        if: always()
        run: docker compose -f compose.test.yaml down -v
