name: Build & Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Compile, Lint & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run Checkstyle lint across all modules
        run: ./gradlew --no-daemon --console=plain checkstyleMain checkstyleTest
      - name: Compile main/test sources and package bootJar
        run: ./gradlew --no-daemon --console=plain compileJava compileTestJava bootJar
