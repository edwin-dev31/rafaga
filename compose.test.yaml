name: rafaga-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: rafaga-postgres-test
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-rafaga_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-rafaga_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-rafaga_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:8-alpine
    container_name: rafaga-redis-test
    ports:
      - "${TEST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
