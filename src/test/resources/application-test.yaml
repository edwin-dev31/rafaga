spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:${TEST_KEYCLOAK_PORT:8081}/realms/rafaga/protocol/openid-connect/certs
  datasource:
    url: ${TEST_DB_SHARED_URL:jdbc:postgresql://localhost:5433/rafaga_test}
    username: ${TEST_DB_SHARED_USER:rafaga_test}
    password: ${TEST_DB_SHARED_PASSWORD:rafaga_test}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RafagaTestPool
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 5m
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6380}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

rafaga:
  web:
    allowed-origins: ${TEST_ALLOWED_ORIGINS:http://localhost:3000}
  identity:
    registration-token: ${TEST_REGISTRATION_TOKEN:rafaga_test_registration_token}
    keycloak:
      issuer-uri: http://localhost:${TEST_KEYCLOAK_PORT:8081}/realms/rafaga
      client-id: ${TEST_KEYCLOAK_CLIENT_ID:rafaga-backend}
      client-secret: ${TEST_KEYCLOAK_CLIENT_SECRET:rafaga_test_client_secret}
      admin-client-id: ${TEST_KEYCLOAK_ADMIN_CLIENT_ID:rafaga-backend-admin}
      admin-client-secret: ${TEST_KEYCLOAK_ADMIN_CLIENT_SECRET:rafaga_test_admin_client_secret}
