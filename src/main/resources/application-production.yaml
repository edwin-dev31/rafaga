spring:
  config:
    import: optional:file:./.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  datasource:
    url: ${DB_SHARED_URL}
    username: ${DB_SHARED_USER}
    password: ${DB_SHARED_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RafagaSharedPool
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${DB_SHARED_URL}
    user: ${DB_SHARED_USER}
    password: ${DB_SHARED_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  data:
    redis:
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      show-components: never
      show-details: never
  health:
    db:
      enabled: true
    redis:
      enabled: true

rafaga:
  tenant:
    internal-header:
      enabled: false
      trusted-cidrs: []
  web:
    allowed-origins: ${RAFAGA_ALLOWED_ORIGINS}
  identity:
    registration-token: ${RAFAGA_IDENTITY_REGISTRATION_TOKEN}
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      client-id: ${KEYCLOAK_CLIENT_ID}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

media:
  r2:
    account-id: ${MEDIA_R2_ACCOUNT_ID}
    access-key-id: ${MEDIA_R2_ACCESS_KEY_ID}
    secret-access-key: ${MEDIA_R2_SECRET_ACCESS_KEY}
    bucket: ${MEDIA_R2_BUCKET:rafaga-media}
    public-base-url: ${MEDIA_R2_PUBLIC_BASE_URL:https://media.rafaga.com}

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

logging:
  level:
    root: WARN
    com.rafaga.backend: WARN
