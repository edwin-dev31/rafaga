spring:
  config:
    import: optional:file:./.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  datasource:
    url: ${DB_SHARED_URL}
    username: ${DB_SHARED_USER}
    password: ${DB_SHARED_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RafagaSharedPool
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${DB_SHARED_URL}
    user: ${DB_SHARED_USER}
    password: ${DB_SHARED_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

rafaga:
  tenant:
    internal-header:
      enabled: false
      trusted-cidrs: []
  web:
    allowed-origins: ${RAFAGA_ALLOWED_ORIGINS}
  identity:
    registration-token: ${RAFAGA_IDENTITY_REGISTRATION_TOKEN}
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      client-id: ${KEYCLOAK_CLIENT_ID}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

logging:
  level:
    com.rafaga.backend: WARN
