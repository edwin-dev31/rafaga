spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8082}/realms/rafaga/protocol/openid-connect/certs}
  datasource:
    url: ${DB_SHARED_URL:jdbc:postgresql://localhost:5432/rafaga_shared}
    username: ${DB_SHARED_USER:rafaga_app}
    password: ${DB_SHARED_PASSWORD:rafaga_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RafagaSharedPool
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/migration/dev
  cache:
    type: redis
    redis:
      time-to-live: 5m
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

rafaga:
  web:
    allowed-origins: ${RAFAGA_ALLOWED_ORIGINS:http://localhost:3000}
  identity:
    registration-token: ${RAFAGA_IDENTITY_REGISTRATION_TOKEN:}
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8082}/realms/rafaga}
      client-id: ${KEYCLOAK_CLIENT_ID:rafaga-backend}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:rafaga_dev_client_secret}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:rafaga-backend-admin}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:rafaga_dev_admin_client_secret}

logging:
  level:
    com.rafaga.backend: INFO
