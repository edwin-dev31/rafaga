spring:
  config:
    import: optional:file:./.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8080}/realms/rafaga/protocol/openid-connect/certs}
  datasource:
    url: ${DB_SHARED_URL:jdbc:postgresql://localhost:5432/rafaga_shared}
    username: ${DB_SHARED_USER:rafaga_runtime}
    password: ${DB_SHARED_PASSWORD:rafaga_runtime_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RafagaSharedPool
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/dev-migration
    url: ${DB_SHARED_URL:jdbc:postgresql://localhost:5432/rafaga_shared}
    user: ${POSTGRES_USER:rafaga_app}
    password: ${POSTGRES_PASSWORD:rafaga_dev}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      show-components: always
      show-details: always

rafaga:
  tenant:
    dev-default-tenant: tenant-demo
  web:
    allowed-origins: ${RAFAGA_ALLOWED_ORIGINS:http://localhost:3000}
  identity:
    registration-token: ${RAFAGA_IDENTITY_REGISTRATION_TOKEN:}
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8080}/realms/rafaga}
      client-id: ${KEYCLOAK_CLIENT_ID:rafaga-backend}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:rafaga_dev_client_secret}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:rafaga-backend-admin}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:rafaga_dev_admin_client_secret}

springdoc:
  api-docs:
    enabled: true

scalar:
  enabled: true

logging:
  level:
    com.rafaga.backend: INFO
    com.rafaga.backend.tenant: DEBUG
    org.springframework.modulith: DEBUG
