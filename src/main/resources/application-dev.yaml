spring:
  datasource:
    url: ${DB_SHARED_URL:jdbc:postgresql://localhost:5432/rafaga_shared}
    username: ${DB_SHARED_USER:rafaga_app}
    password: ${DB_SHARED_PASSWORD:rafaga_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RafagaSharedPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    com.rafaga.backend: INFO
