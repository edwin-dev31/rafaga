spring:
  application:
    name: rafaga-backend
  profiles:
    default: dev
  main:
    allow-bean-definition-overriding: true

server:
  port: ${RAFAGA_SERVER_PORT:3117}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: when_authorized
      show-details: when_authorized
      status:
        order: down,out-of-service,degraded,unknown,up
        http-mapping:
          down: 503
          out-of-service: 503
          degraded: 200
  health:
    db:
      enabled: false
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

rafaga:
  tenant:
    internal-header:
      enabled: false
      trusted-cidrs: []
