spring:
  application:
    name: rafaga-backend
  profiles:
    default: dev
  main:
    allow-bean-definition-overriding: true

server:
  port: ${RAFAGA_SERVER_PORT:3117}

springdoc:
  api-docs:
    enabled: false

scalar:
  enabled: false

rafaga:
  tenant:
    internal-header:
      enabled: false
      trusted-cidrs: []
